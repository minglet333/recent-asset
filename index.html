<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 자산현황판</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    :root{--color-background-primary:#ffffff;--color-background-secondary:#f5f5f3;--color-background-tertiary:#eeece8;--color-text-primary:#1a1a18;--color-text-secondary:#6b6a65;--color-border-tertiary:rgba(0,0,0,0.10);--color-border-secondary:rgba(0,0,0,0.18);--color-border-info:#185FA5;--color-text-info:#185FA5;--border-radius-md:8px;--border-radius-lg:12px;--font-sans:'Noto Sans KR',sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background:var(--color-background-tertiary);color:var(--color-text-primary);min-height:100vh;padding:2rem 1rem}
    .container{max-width:720px;margin:0 auto}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    .ti-svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
    .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
    .top-bar h1{font-size:18px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:8px}
    .sub{font-size:13px;color:var(--color-text-secondary);margin-top:2px}
    .month-nav{display:flex;align-items:center;gap:8px}
    .month-nav button{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:4px 10px;font-size:13px;cursor:pointer;color:var(--color-text-primary);font-family:var(--font-sans)}
    .month-nav button:hover{background:var(--color-background-secondary)}
    .month-label{font-size:14px;font-weight:500;color:var(--color-text-primary);min-width:80px;text-align:center}
    .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.25rem}
    .mc{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.85rem 1rem}
    .mc .lbl{font-size:11px;margin-bottom:5px}
    .mc .val{font-size:14px;font-weight:500;color:var(--color-text-primary);line-height:1.3}
    .mc .pct{font-size:11px;color:var(--color-text-secondary);margin-top:3px}
    .card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem}
    .card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
    .card-hd h2{font-size:15px;font-weight:500;color:var(--color-text-primary)}
    .add-btn{background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:3px 7px;font-size:12px;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font-sans)}
    .add-btn:hover{background:var(--color-background-secondary)}
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.38);z-index:100;align-items:center;justify-content:center}
    .modal-backdrop.open{display:flex}
    .modal{background:var(--color-background-primary);border-radius:var(--border-radius-lg);padding:1.5rem;width:320px;max-width:90vw;border:0.5px solid var(--color-border-secondary)}
    .modal-title{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between}
    .modal-close{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:20px;line-height:1;padding:0;font-family:var(--font-sans)}
    .modal-row{margin-bottom:12px}
    .modal-row label{display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
    .modal-input{width:100%;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px 10px;background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans)}
    .modal-input:focus{outline:none;border-color:var(--color-border-info)}
    .modal-submit{width:100%;margin-top:4px;padding:9px;font-size:13px;font-weight:500;cursor:pointer;border:none;border-radius:var(--border-radius-md);background:var(--color-text-primary);color:var(--color-background-primary);font-family:var(--font-sans)}
    .modal-submit:hover{opacity:0.85}
    .pie-row{display:flex;gap:2rem;align-items:center}
    .pie-wrap{position:relative;flex:0 0 175px;height:175px}
    .legend{display:flex;flex-direction:column;gap:8px;flex:1;justify-content:center}
    .legend-item{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--color-text-secondary)}
    .legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
    .empty-msg{font-size:13px;color:var(--color-text-secondary);text-align:center;padding:1.5rem 0}
    .asset-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:0}
    .asset-card-top{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.25rem 1rem}
    .asset-card-top h2{font-size:15px;font-weight:500;color:var(--color-text-primary)}
    .asset-table{width:100%;border-collapse:collapse;font-size:13px}
    .asset-table thead tr{background:var(--color-background-secondary)}
    .asset-table th{font-size:12px;font-weight:500;color:var(--color-text-secondary);padding:9px 0;white-space:nowrap;border-top:0.5px solid var(--color-border-tertiary);border-bottom:0.5px solid var(--color-border-secondary)}
    .asset-table th.r,.asset-table td.r{text-align:right}
    .asset-table th.c,.asset-table td.c{text-align:center}
    .asset-table th:first-child,.asset-table td:first-child{padding-left:16px}
    .asset-table th:not(:last-child),.asset-table td:not(:last-child){padding-right:8px}
    .asset-table th:last-child,.asset-table td:last-child{padding-right:20px;text-align:right}
    .asset-table td{padding:9px 0;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary);vertical-align:middle}
    .asset-table tbody tr:last-child td{border-bottom:none}
    .cat-badge{display:inline-block;font-size:11px;padding:2px 6px;border-radius:var(--border-radius-md)}
    .pos{color:#1D9E75;font-size:12px}.neg{color:#D85A30;font-size:12px}
    .group-hd td{padding:8px 16px;border-top:0.5px solid var(--color-border-tertiary);border-bottom:0.5px solid var(--color-border-tertiary);white-space:nowrap;overflow:visible}
    .group-hd:first-child td{border-top:none}
    .group-inner{display:flex;align-items:baseline;gap:10px}
    .group-name{font-size:13px;font-weight:500}
    .group-subtotal{font-size:12px;opacity:0.75}
    .icon-btn{background:none;border:none;outline:none;padding:4px 2px;font-size:14px;cursor:pointer;color:var(--color-text-secondary);border-radius:var(--border-radius-md);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-sans)}
    .icon-btn:hover{background:var(--color-background-secondary)}
    .icon-btn.ok{color:var(--color-text-info)}
    .edit-input{font-size:12px;border:0.5px solid var(--color-border-info);border-radius:var(--border-radius-md);padding:3px 6px;background:var(--color-background-primary);color:var(--color-text-primary);width:100%;font-family:var(--font-sans)}
    .edit-select{font-size:12px;border:0.5px solid var(--color-border-info);border-radius:var(--border-radius-md);padding:3px 4px;background:var(--color-background-primary);color:var(--color-text-primary);width:100%;font-family:var(--font-sans)}
  </style>
</head>
<body>
<div class="container">
  <h2 class="sr-only">부부 공동 자산현황판</h2>
  <div class="top-bar">
    <div>
      <h1><span>🏠</span>우리 자산현황판</h1>
      <div class="sub" id="total-sub"></div>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)"><svg class="ti-svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="month-label" id="month-label"></span>
      <button onclick="changeMonth(1)"><svg class="ti-svg" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem" id="liquidity-grid"></div>
  <div class="summary-grid" id="summary-grid"></div>
  <div class="card">
    <div class="card-hd"><h2>자산 구성 비율</h2></div>
    <div class="pie-row">
      <div class="pie-wrap"><canvas id="pieChart" role="img" aria-label="자산 분류별 비율 도넛 차트"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-hd">
      <h2>월별 총자산 추이 <span style="font-size:12px;font-weight:400;color:var(--color-text-secondary)">— 기록된 달만 표시</span></h2>
    </div>
    <div id="trend-wrap" style="position:relative;width:100%;height:200px">
      <canvas id="trendChart" role="img" aria-label="월별 총자산 변동 추이 라인 차트"></canvas>
    </div>
    <div id="trend-empty" class="empty-msg" style="display:none">기록된 달이 2개 이상이면 그래프가 표시돼요</div>
  </div>
  <div class="asset-card">
    <div class="asset-card-top" style="flex-wrap:wrap;gap:6px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <h2>자산 내역</h2>
        <span id="last-updated" style="font-size:11px;color:var(--color-text-secondary)"></span>
      </div>
      <button class="add-btn" onclick="toggleAdd()"><svg class="ti-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 추가</button>
    </div>
    <table class="asset-table">
      <thead><tr>
        <th>분류</th><th>항목명</th><th class="r">금액</th>
        <th class="r">전월 대비</th><th colspan="2"></th>
      </tr></thead>
      <tbody id="asset-tbody"></tbody>
    </table>
  </div>
</div>

<script>
var SVG={
  check:'<svg class="ti-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  x:'<svg class="ti-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  edit:'<svg class="ti-svg" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  trash:'<svg class="ti-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>'
};
var COLORS={'은행':'#378ADD','증권':'#1D9E75','디지털자산':'#EF9F27','연금IRP':'#7F77DD','부동산':'#D4537E'};
var CAT_BG={'은행':'#E6F1FB','증권':'#E1F5EE','디지털자산':'#FAEEDA','연금IRP':'#EEEDFE','부동산':'#FBEAF0'};
var CAT_TEXT={'은행':'#0C447C','증권':'#085041','디지털자산':'#633806','연금IRP':'#3C3489','부동산':'#72243E'};
var ORDER=['은행','증권','디지털자산','연금IRP','부동산'];
var OWNER_DISPLAY={'나':'누미','남편':'두미','공동':'공동'};
var OWNER_ORDER=['나','남편','공동'];
var OWNER_BG={'나':'#EEEDFE','남편':'#E1F5EE','공동':'#F1EFE8'};
var OWNER_TEXT={'나':'#3C3489','남편':'#085041','공동':'#444441'};

var cy=new Date().getFullYear(), cm=new Date().getMonth();
var lastUpdated=null;
var monthlyData={}, nextId=200, editingId=null, showAdd=false;
var dbSet=null;

function mkey(y,m){return y+'-'+String(m+1).padStart(2,'0')}
function prevYM(y,m){var pm=m-1,py=y;if(pm<0){pm=11;py--;}return[py,pm]}
function getAssets(y,m){return monthlyData[mkey(y,m)]||[]}
function calcTotal(a){return a.reduce(function(s,x){return s+x.amount},0)}
function calcCats(a){var c={};a.forEach(function(x){c[x.cat]=(c[x.cat]||0)+x.amount});return c}
function fmt(n){return Number(n||0).toLocaleString()}
function fmtW(n){return Number(n||0).toLocaleString()+'원'}
function shortYear(y){return String(y).slice(-2)}
function saveToStorage(){
  lastUpdated=new Date();
  updateTimestamp();
  if(dbSet) dbSet(monthlyData);
}
function updateTimestamp(){
  var el=document.getElementById('last-updated');
  if(!el) return;
  if(!lastUpdated){el.textContent='';return;}
  var d=lastUpdated;
  var pad=function(n){return String(n).padStart(2,'0')};
  el.textContent='최근 업데이트 '+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function initDefaultData(){
  var key=mkey(cy,cm);
  var pv=prevYM(cy,cm); var pkey=mkey(pv[0],pv[1]);
  monthlyData[key]=[
    {id:1,cat:'은행',name:'국민은행 적금',owner:'나',amount:15000000},
    {id:2,cat:'은행',name:'신한은행 예금',owner:'남편',amount:30000000},
    {id:3,cat:'증권',name:'삼성전자 주식',owner:'나',amount:8000000},
    {id:4,cat:'증권',name:'미국ETF',owner:'남편',amount:12000000},
    {id:5,cat:'디지털자산',name:'비트코인',owner:'공동',amount:5000000},
    {id:6,cat:'연금IRP',name:'IRP계좌',owner:'나',amount:20000000},
    {id:7,cat:'연금IRP',name:'IRP계좌',owner:'남편',amount:18000000},
    {id:8,cat:'부동산',name:'아파트 분양권',owner:'공동',amount:80000000}
  ];
  monthlyData[pkey]=[
    {id:1,cat:'은행',name:'국민은행 적금',owner:'나',amount:14500000},
    {id:2,cat:'은행',name:'신한은행 예금',owner:'남편',amount:29000000},
    {id:3,cat:'증권',name:'삼성전자 주식',owner:'나',amount:7600000},
    {id:4,cat:'증권',name:'미국ETF',owner:'남편',amount:11500000},
    {id:5,cat:'디지털자산',name:'비트코인',owner:'공동',amount:4200000},
    {id:6,cat:'연금IRP',name:'IRP계좌',owner:'나',amount:19500000},
    {id:7,cat:'연금IRP',name:'IRP계좌',owner:'남편',amount:17500000},
    {id:8,cat:'부동산',name:'아파트 분양권',owner:'공동',amount:80000000}
  ];
  saveToStorage();
}

function renderMonth(){
  var assets=getAssets(cy,cm);
  var pv=prevYM(cy,cm); var prev=getAssets(pv[0],pv[1]);
  var total=calcTotal(assets), prevTotal=calcTotal(prev);
  var diff=total-prevTotal;
  var pct=prevTotal?((diff/prevTotal)*100).toFixed(1):'0.0';
  document.getElementById('total-sub').textContent='총 '+fmtW(total)+' · 전월 대비 '+(diff>=0?'+':'')+fmtW(diff)+' ('+(diff>=0?'+':'')+pct+'%)';
  var cats=calcCats(assets);
  document.getElementById('summary-grid').innerHTML=ORDER.map(function(c){
    return '<div class="mc"><div class="lbl" style="color:'+CAT_TEXT[c]+'">'+c+'</div><div class="val">'+fmtW(cats[c]||0)+'</div><div class="pct">'+(total?Math.round((cats[c]||0)/total*100):0)+'%</div></div>';
  }).join('');
  renderTable(assets,prev);
  renderPie(cats,total);
  renderTrend();
  renderLiquidity(assets,total);
}

function renderTable(assets,prev){
  var tbody=document.getElementById('asset-tbody');
  var html='';
  OWNER_ORDER.forEach(function(owner){
    var group=assets.filter(function(a){return a.owner===owner});
    if(!group.length) return;
    var gt=calcTotal(group), label=OWNER_DISPLAY[owner], bg=OWNER_BG[owner], tc=OWNER_TEXT[owner];
    html+='<tr class="group-hd" style="background:'+bg+'"><td colspan="6" style="background:'+bg+'"><div class="group-inner"><span class="group-name" style="color:'+tc+'">'+label+'</span><span class="group-subtotal" style="color:'+tc+'">'+fmt(gt)+'만원</span></div></td></tr>';
    group.forEach(function(a){
      var p=prev.find(function(x){return x.id===a.id});
      var d=p!=null?a.amount-p.amount:null;
      var sign=d>0?'+':''; var cls=d>0?'pos':d<0?'neg':'';
      if(editingId===a.id){
        html+='<tr id="row-'+a.id+'">'
          +'<td><select class="edit-select" id="e-cat-'+a.id+'">'+ORDER.map(function(c){return '<option'+(c===a.cat?' selected':'')+'>'+c+'</option>'}).join('')+'</select></td>'
          +'<td><input class="edit-input" id="e-name-'+a.id+'" value="'+a.name+'" /></td>'
          +'<td class="r"><input class="edit-input" id="e-amt-'+a.id+'" type="number" value="'+a.amount+'" style="text-align:right" /></td>'
          +'<td class="r"><select class="edit-select" id="e-owner-'+a.id+'" style="font-size:11px">'
          +'<option value="나"'+(a.owner==='나'?' selected':'')+'>누미</option>'
          +'<option value="남편"'+(a.owner==='남편'?' selected':'')+'>두미</option>'
          +'<option value="공동"'+(a.owner==='공동'?' selected':'')+'>공동</option>'
          +'</select></td>'
          +'<td colspan="2" style="white-space:nowrap;text-align:right;padding-right:20px"><button class="icon-btn ok" onclick="saveEdit('+a.id+')">'+SVG.check+'</button><button class="icon-btn" style="margin-left:4px" onclick="cancelEdit()">'+SVG.x+'</button></td>'
          +'</tr>';
      } else {
        html+='<tr id="row-'+a.id+'">'
          +'<td><span class="cat-badge" style="background:'+CAT_BG[a.cat]+';color:'+CAT_TEXT[a.cat]+'">'+a.cat+'</span></td>'
          +'<td>'+a.name+'</td>'
          +'<td class="r" style="font-weight:500">'+fmtW(a.amount)+'</td>'
          +'<td class="r"><span class="'+cls+'">'+(d!==null&&d!==0?sign+fmtW(Math.abs(d)):'—')+'</span></td>'
          +'<td colspan="2" style="white-space:nowrap;text-align:right;padding-right:20px"><button class="icon-btn" onclick="startEdit('+a.id+')">'+SVG.edit+'</button><button class="icon-btn" style="margin-left:4px" onclick="deleteAsset('+a.id+')">'+SVG.trash+'</button></td>'
          +'</tr>';
      }
    });
  });

  tbody.innerHTML=html;
}

function toggleAdd(){document.getElementById('addModal').classList.add('open');document.getElementById('m-cat').value='';document.getElementById('m-name').value='';document.getElementById('m-amt').value='';document.getElementById('m-owner').value='나';}
function closeModal(){document.getElementById('addModal').classList.remove('open')}
function modalBackdropClick(e){if(e.target===document.getElementById('addModal')) closeModal()}
function cancelAdd(){closeModal()}
function confirmAdd(){}
function confirmModal(){
  var cat=document.getElementById('m-cat').value;
  var name=document.getElementById('m-name').value.trim();
  var owner=document.getElementById('m-owner').value;
  var amount=parseInt(document.getElementById('m-amt').value)||0;
  if(!cat||!name||!amount){alert('분류, 항목명, 금액을 입력해주세요.');return;}
  var key=mkey(cy,cm);
  if(!monthlyData[key]) monthlyData[key]=[];
  monthlyData[key].push({id:nextId++,cat:cat,name:name,owner:owner,amount:amount});
  closeModal();saveToStorage();renderMonth();
}
function startEdit(id){editingId=id;showAdd=false;renderMonth()}
function cancelEdit(){editingId=null;renderMonth()}
function saveEdit(id){
  var key=mkey(cy,cm);
  var a=monthlyData[key].find(function(x){return x.id===id});
  if(!a) return;
  var cat=document.getElementById('e-cat-'+id);
  var name=document.getElementById('e-name-'+id);
  var amt=document.getElementById('e-amt-'+id);
  var owner=document.getElementById('e-owner-'+id);
  if(cat) a.cat=cat.value;
  if(name&&name.value.trim()) a.name=name.value.trim();
  if(amt) a.amount=parseInt(amt.value)||a.amount;
  if(owner) a.owner=owner.value;
  editingId=null;saveToStorage();renderMonth();
}
function deleteAsset(id){
  var key=mkey(cy,cm);
  monthlyData[key]=monthlyData[key].filter(function(a){return a.id!==id});
  saveToStorage();renderMonth();
}
function changeMonth(dir){
  cm+=dir;if(cm>11){cm=0;cy++;}if(cm<0){cm=11;cy--;}
  document.getElementById('month-label').textContent=cy+'년 '+(cm+1)+'월';
  editingId=null;showAdd=false;renderMonth();
}


function renderLiquidity(assets,total){
  var LOW_CATS={'연금IRP':true,'부동산':true};
  var high=0,low=0;
  assets.forEach(function(a){if(LOW_CATS[a.cat]) low+=a.amount; else high+=a.amount;});
  var g=document.getElementById('liquidity-grid');
  if(!g) return;
  g.innerHTML=
    '<div class="mc" style="border-left:3px solid #1D9E75">'
    +'<div class="lbl" style="color:#085041">고환금성</div>'
    +'<div class="val">'+fmtW(high)+'</div>'
    +'<div class="pct">'+(total?Math.round(high/total*100):0)+'%</div>'
    +'</div>'
    +'<div class="mc" style="border-left:3px solid #7F77DD">'
    +'<div class="lbl" style="color:#3C3489">저환금성</div>'
    +'<div class="val">'+fmtW(low)+'</div>'
    +'<div class="pct">'+(total?Math.round(low/total*100):0)+'%</div>'
    +'</div>';
}
var pieInst=null,trendInst=null;
function renderPie(cats,total){
  var data=ORDER.map(function(c){return cats[c]||0});
  var ctx=document.getElementById('pieChart').getContext('2d');
  if(pieInst) pieInst.destroy();
  pieInst=new Chart(ctx,{type:'doughnut',data:{labels:ORDER,datasets:[{data:data,backgroundColor:ORDER.map(function(c){return COLORS[c]}),borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' '+fmt(c.raw)+'만원 ('+(total?Math.round(c.raw/total*100):0)+'%)'}}}}}});
  document.getElementById('legend').innerHTML=ORDER.map(function(c,i){return '<div class="legend-item"><span><span class="legend-dot" style="background:'+COLORS[c]+'"></span>'+c+'</span><span style="font-weight:500;color:var(--color-text-primary)">'+(total?Math.round((data[i]||0)/total*100):0)+'% <span style="font-weight:400;color:var(--color-text-secondary)">'+fmt(data[i])+'</span></span></div>'}).join('');
}
function renderTrend(){
  var sorted=Object.entries(monthlyData).filter(function(e){return e[1]&&e[1].length>0}).map(function(e){var p=e[0].split('-').map(Number);return{key:e[0],label:shortYear(p[0])+'년 '+p[1]+'월',total:calcTotal(e[1])};}).sort(function(a,b){return a.key.localeCompare(b.key)});
  var wrap=document.getElementById('trend-wrap'),empty=document.getElementById('trend-empty');
  if(sorted.length<2){wrap.style.display='none';empty.style.display='block';return;}
  wrap.style.display='block';empty.style.display='none';
  var pctData=sorted.map(function(e,i){if(i===0) return null;var p=sorted[i-1].total;return p?parseFloat(((e.total-p)/p*100).toFixed(1)):null;});
  var ctx=document.getElementById('trendChart').getContext('2d');
  if(trendInst) trendInst.destroy();
  trendInst=new Chart(ctx,{type:'line',data:{labels:sorted.map(function(e){return e.label}),datasets:[{label:'총자산',data:sorted.map(function(e){return e.total}),borderColor:'#378ADD',backgroundColor:'rgba(55,138,221,0.08)',fill:true,tension:0.35,pointRadius:5,pointBackgroundColor:'#378ADD'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' '+fmtW(c.raw)},afterLabel:function(c){var p=pctData[c.dataIndex];return p!=null?'전월 대비 '+(p>=0?'+':'')+p+'%':''}}}},scales:{y:{ticks:{callback:function(v){return fmtW(v)}},grid:{color:'rgba(128,128,128,0.1)'}},x:{grid:{display:false},ticks:{autoSkip:false,maxRotation:0,font:{size:11}}}}}});
}
